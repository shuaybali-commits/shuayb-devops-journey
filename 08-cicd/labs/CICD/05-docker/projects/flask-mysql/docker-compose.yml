services:
  web:
    build: .
    image: flask-mysql:v1
    container_name: flask-mysql-web
    restart: unless-stopped
    ports:
      - "5002:5000"
    env_file:
      - .env
    depends_on:
      mydb:
        condition: service_healthy

  mydb:
    image: mysql:8
    container_name: flask-mysql-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
